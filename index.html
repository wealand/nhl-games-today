<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="Kvvc2-jF061MVI8WivdPFz5cAytkMIA-1ycoeTICHMY" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Games Today & Schedule</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>NHL Games Tracker</h1>
        <p class="subtitle">Live Scores, Broadcasts, Odds & Team Schedules</p>
    </header>

    <div class="controls-panel">
        <div class="date-controls">
            <button id="prev-day-btn" class="nav-btn icon-btn" title="Previous Day" aria-label="Previous Day">&#8592;</button>
            <input type="date" id="date-picker" class="date-input" aria-label="Select Date">
            <button id="today-btn" class="nav-btn action-btn" title="Jump to Today">Today</button>
            <button id="next-day-btn" class="nav-btn icon-btn" title="Next Day" aria-label="Next Day">&#8594;</button>
        </div>

        <div class="team-controls">
            <select id="team-select" class="team-select" aria-label="Filter by Team">
                <option value="all">All Teams</option>
            </select>
            <button id="view-schedule-btn" class="nav-btn secondary-btn" style="display: none;">View Season Schedule</button>
        </div>
    </div>

    <div id="view-header" class="view-header">
        <span id="current-view-title" class="current-view-title">Loading...</span>
        <button id="back-to-daily-btn" class="nav-btn link-btn" style="display: none;">&#8592; Back to Daily Games</button>
    </div>

    <main id="game-container">
        <div class="loading">Loading game data...</div>
    </main>

    <footer>
        <p>Made by wealand</p>
        <a href="https://buymeacoffee.com/icecapades" target="_blank" rel="noopener noreferrer" class="coffee-button">
            <img src="https://storage.ko-fi.com/cdn/kofi3.png?v=3" alt="Buy Me a Coffee">
        </a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
